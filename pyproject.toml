[build-system]
requires = [
    "setuptools>=61.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "ec_tools"
version = "0.3.0"
description = "A collection of tool for EC."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "colorama==0.4.6",
    "pycryptodome==3.20.0",
    "setuptools==69.5.1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = ["black"]

[tool.black]
line-length = 120

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests/"
]

[tool.setuptools.packages.find]
where = ["ec_tools"]
