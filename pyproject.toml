[build-system]
requires = [
    "setuptools>=77.0.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "ec_tools"
version = "3.3"
description = "A lightweight toolbox for data models, SQLite DAOs, encrypted storage, and utility helpers."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "colorama==0.4.6",
    "pycryptodome==3.20.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Database",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit>=4.5.1",
    "pytest",
]

[tool.black]
line-length = 120

[dependency-groups]
dev = [
    "black",
    "pre-commit>=4.5.1",
    "pytest",
    "twine>=6.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
    "tests/"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ec_tools*"]
exclude = ["demos*", "tests*"]
